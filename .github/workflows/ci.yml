name: TypeScript CI
on:
  push:
    branches: [master, 'codex/**']
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  verify:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run typecheck
      - run: npm run build
      - run: node node_modules/playwright-core/cli.js install chromium
        if: runner.os != 'Linux'
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
        if: runner.os == 'Linux'
      - run: npm test
      - run: npm run test:ui
        env:
          GOPHER_E2E: '1'
      - name: Allow the Electron namespace sandbox on restricted Ubuntu hosts
        if: runner.os == 'Linux'
        run: |
          id -u
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = 1 ]; then
            cat > "$RUNNER_TEMP/gopher-electron.apparmor" <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile gopher-ci "$GITHUB_WORKSPACE/node_modules/electron/dist/electron" flags=(unconfined) {
            userns,
          }
          EOF
            sudo apparmor_parser -r "$RUNNER_TEMP/gopher-electron.apparmor"
          fi
      - name: Native desktop smoke (Linux virtual display, Chromium sandbox enabled)
        if: runner.os == 'Linux'
        run: |
          xvfb-run --auto-servernum node node_modules/electron/cli.js scripts/smoke-desktop.cjs
          xvfb-run --auto-servernum node node_modules/electron/cli.js scripts/smoke-desktop.cjs --reuse-server
        timeout-minutes: 2
      - name: Native desktop smoke
        if: runner.os != 'Linux'
        run: |
          node node_modules/electron/cli.js scripts/smoke-desktop.cjs
          node node_modules/electron/cli.js scripts/smoke-desktop.cjs --reuse-server
        timeout-minutes: 2
